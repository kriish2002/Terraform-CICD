pool:
  name: Terraform-DevOps-Pool

trigger:
  branches:
    include:
      - master
      - main
      - feature/*

stages:

# ============================================================
# STAGE 1 - TERRAFORM INIT & VALIDATE
# ============================================================

- stage: TerraformInitAndValidate
  displayName: "Terraform Init and Validate"

  jobs:

  - job: InitAndValidate
    displayName: "Init and Validate"

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------

    - task: TerraformInstaller@1
      displayName: "Install Terraform"
      inputs:
        terraformVersion: "1.9.8"

    # --------------------------------------------------------
    # Verify Terraform
    # --------------------------------------------------------

    - powershell: |
        terraform --version
        Write-Host "Terraform installed successfully"
      displayName: "Verify Terraform"

    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------

    - task: TerraformTask@5
      displayName: "Terraform Init"
      inputs:
        provider: azurerm
        command: init
        workingDirectory: "$(Build.SourcesDirectory)/terraform/environments/dev"
        backendServiceArm: svc-ado
        backendAzureRmResourceGroupName: ado-storage
        backendAzureRmStorageAccountName: checkstorage132423
        backendAzureRmContainerName: containerstorage
        backendAzureRmKey: dev.terraform.tfstate

    # --------------------------------------------------------
    # Terraform Format Check
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform formatting check failed"
          exit 1
        }

      displayName: "Terraform Format Check"

    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        terraform validate

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed"
          exit 1
        }

      displayName: "Terraform Validate"


# ============================================================
# STAGE 2 - TERRAFORM SECURITY SCAN
# ============================================================

- stage: SecurityScan
  displayName: "Terraform Security Scan"

  dependsOn:
    - TerraformInitAndValidate

  jobs:

  - job: SecurityScan
    displayName: "TFSec TFLint Checkov"

    steps:

    # --------------------------------------------------------
    # Install TFSec
    # --------------------------------------------------------

    - powershell: |
        Write-Host "Installing TFSec..."

        choco install tfsec -y

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFSec installation failed"
          exit 1
        }

      displayName: "Install TFSec"

    # --------------------------------------------------------
    # Verify TFSec
    # --------------------------------------------------------

    - powershell: |
        tfsec --version
      displayName: "Verify TFSec"

    # --------------------------------------------------------
    # Run TFSec
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)"

        tfsec terraform/

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFSec security scan failed"
          exit 1
        }

      displayName: "Run TFSec"

    # --------------------------------------------------------
    # Install TFLint
    # --------------------------------------------------------

    - powershell: |
        Write-Host "Installing TFLint..."

        choco install tflint -y

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint installation failed"
          exit 1
        }

      displayName: "Install TFLint"

    # --------------------------------------------------------
    # Verify TFLint
    # --------------------------------------------------------

    - powershell: |
        tflint --version
      displayName: "Verify TFLint"

    # --------------------------------------------------------
    # Initialize TFLint
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        tflint --init

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint initialization failed"
          exit 1
        }

      displayName: "Initialize TFLint"

    # --------------------------------------------------------
    # Run TFLint
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        tflint

        if ($LASTEXITCODE -ne 0) {
          Write-Error "TFLint validation failed"
          exit 1
        }

      displayName: "Run TFLint"

    # --------------------------------------------------------
    # Install Checkov
    # --------------------------------------------------------

    - powershell: |
        python --version

        python -m pip install --upgrade pip

        pip install checkov

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov installation failed"
          exit 1
        }

      displayName: "Install Checkov"

    # --------------------------------------------------------
    # Run Checkov
    # --------------------------------------------------------

    - powershell: |
        cd "$(Build.SourcesDirectory)"

        checkov -d terraform/

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Checkov security scan failed"
          exit 1
        }

      displayName: "Run Checkov"