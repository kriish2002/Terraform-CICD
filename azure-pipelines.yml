# ==============================================================================
#                 TERRAFORM CI/CD PIPELINE (DEV ENVIRONMENT)
# ==============================================================================
# Yeh pipeline standard 4 stages me bani hai:
# 1. TerraformInitAndValidate : Code initialize aur syntax validate karta hai
# 2. TerraformPlan            : Azure me kya resources banenge uska plan banata hai
# 3. ManualApproval           : Apply hone se pehle user ka manual approval mangta hai
# 4. TerraformApply           : Approved hone ke baad Azure par resources create karta hai
# ==============================================================================

# Aapka local self-hosted Windows agent pool:
pool:
  name: "Terraform-DevOps-Pool"

# Master ya feature branches par push hone par trigger hogi:
trigger:
  - master
  - main
  - feature/*

# Reusable variables taaki duplicate values bar-bar na likhni padein:
variables:
  workingDirectory: "$(System.DefaultWorkingDirectory)/terraform/environments/dev"
  serviceConnection: "svc-ado"
  backendResourceGroup: "krish-test"
  backendStorageAccount: "krishtfstate42129"
  backendContainer: "tfstate"
  backendKey: "dev.terraform.tfstate"

stages:

  # ============================================================================
  # STAGE 1: INIT AND VALIDATE
  # ============================================================================
  # Is stage me:
  # - Terraform backend aur Azure provider download/init hote hain
  # - Code syntax validate hota hai taaki koi typo ya error na ho
  # ============================================================================
  - stage: TerraformInitAndValidate
    displayName: "Init and Validate"
    jobs: 
      - job: InitAndValidate
        displayName: "Init and Validate"
        steps:
          # Step 1: Terraform Init
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "$(serviceConnection)"
              backendAzureRmResourceGroupName: "$(backendResourceGroup)"
              backendAzureRmStorageAccountName: "$(backendStorageAccount)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "$(backendKey)"

          # Step 2: Terraform Validate
          - task: TerraformTask@5
            displayName: "Terraform Validate"
            inputs:
              provider: "azurerm"
              command: "validate"
              workingDirectory: "$(workingDirectory)"


  # ============================================================================
  # STAGE 2: TERRAFORM PLAN
  # ============================================================================
  # Is stage me:
  # - Remote backend se state connect hoti hai
  # - Azure subscription scan hoke execution plan generate hota hai
  # ============================================================================
  - stage: TerraformPlan
    displayName: "Plan"
    condition: succeeded()
    dependsOn: TerraformInitAndValidate

    jobs: 
      - job: TerraformPlan
        displayName: "Plan"
        steps:
          # Step 1: Terraform Init (Har naye job me init zaroori hota hai)
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "$(serviceConnection)"
              backendAzureRmResourceGroupName: "$(backendResourceGroup)"
              backendAzureRmStorageAccountName: "$(backendStorageAccount)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "$(backendKey)"

          # Step 2: Terraform Plan (Changes preview karta hai)
          - task: TerraformTask@5
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "$(serviceConnection)"


  # ============================================================================
  # STAGE 3: MANUAL APPROVAL GATE
  # ============================================================================
  # Is stage me:
  # - Pipeline pause ho jayegi aur user approval ka wait karegi
  # - Agent ki zaroorat nahi hoti isliye 'pool: server' use hota hai
  # ============================================================================
  - stage: ManualApproval
    displayName: "Manual Approval Before Apply"
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main'))
    dependsOn: TerraformPlan

    jobs:
      - job: Approval
        displayName: "Waiting for Approval"
        pool: server

        steps:
          - task: ManualValidation@1
            displayName: "Approve Terraform Apply"
            inputs:
              notifyUsers: ""
              instructions: "Terraform Plan complete ho gaya hai. Azure changes review karein aur Apply ke liye Approve karein."
              onTimeout: "reject"


  # ============================================================================
  # STAGE 4: TERRAFORM APPLY
  # ============================================================================
  # Is stage me:
  # - Manual Approval milne ke baad resources Azure cloud par deploy ho jayenge
  # ============================================================================
  - stage: TerraformApply
    displayName: "Apply"
    condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/master', 'refs/heads/main'))
    dependsOn: ManualApproval

    jobs: 
      - job: TerraformApply
        displayName: "Apply"
        steps:
          # Step 1: Terraform Init
          - task: TerraformTask@5
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(workingDirectory)"
              backendServiceArm: "$(serviceConnection)"
              backendAzureRmResourceGroupName: "$(backendResourceGroup)"
              backendAzureRmStorageAccountName: "$(backendStorageAccount)"
              backendAzureRmContainerName: "$(backendContainer)"
              backendAzureRmKey: "$(backendKey)"

          # Step 2: Terraform Apply (Auto-approve ke saath cloud par banayega)
          - task: TerraformTask@5
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(workingDirectory)"
              environmentServiceNameAzureRM: "$(serviceConnection)"
              commandOptions: "-auto-approve"
