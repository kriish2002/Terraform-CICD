pool: Terraform-DevOps-Pool

trigger:
- main
- feature/*

stages:

# ============================================================
# STAGE 1: TERRAFORM INIT + VALIDATE
# ============================================================

- stage: TerraformInitAndValidate
  displayName: Init and Validate

  jobs:
  - job: InitAndValidate
    displayName: Init and Validate

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'


    # --------------------------------------------------------
    # Verify Terraform
    # --------------------------------------------------------
    - powershell: |
        terraform --version
        where.exe terraform
      displayName: Verify Terraform Installation


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'

        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'


    # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'


# ============================================================
# STAGE 2: TERRAFORM PLAN
# ============================================================

- stage: TerraformPlan
  displayName: Terraform Plan
  condition: succeeded()
  dependsOn: TerraformInitAndValidate

  jobs:
  - job: TerraformPlan
    displayName: Plan

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'

        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'


    # --------------------------------------------------------
    # Terraform Plan
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'
        environmentServiceNameAzureRM: 'svc-ado'


# ============================================================
# STAGE 3: MANUAL APPROVAL
# ============================================================

- stage: ManualApproval
  displayName: Manual Approval Before Apply

  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
  )

  dependsOn: TerraformPlan

  jobs:
  - job: Approval
    displayName: Waiting for Approval
    pool: server

    steps:

    - task: ManualValidation@1
      displayName: Approve Terraform Apply
      inputs:
        notifyUsers: ''
        instructions: 'Terraform Plan complete hai. Apply karne ke liye approval dein.'
        onTimeout: 'reject'


# ============================================================
# STAGE 4: TERRAFORM APPLY
# ============================================================

- stage: TerraformApply
  displayName: Terraform Apply

  condition: and(
    succeeded(),
    eq(variables['Build.SourceBranch'], 'refs/heads/main')
  )

  dependsOn: ManualApproval

  jobs:
  - job: TerraformApply
    displayName: Apply

    steps:

    # --------------------------------------------------------
    # Install Terraform
    # --------------------------------------------------------
    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'


    # --------------------------------------------------------
    # Terraform Init
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'

        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'


    # --------------------------------------------------------
    # Terraform Apply
    # --------------------------------------------------------
    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environment/dev'
        environmentServiceNameAzureRM: 'svc-ado'
        commandOptions: '-auto-approve'