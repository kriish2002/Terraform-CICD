pool: Terraform-DevOps-Pool

trigger:
  - main
  - feature/*

stages:
  - stage: TerraformInitAndValidate
    displayName: 'Terraform Init and Validate'

    jobs:
      - job: InitAndValidate
        displayName: 'Terraform CI Pipeline'

        steps:
          # Step 1: Install Terraform
          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '1.16.4'

          # Step 2: Debug Terraform executable
          - task: PowerShell@2
            displayName: 'Debug Terraform Executable'
            inputs:
              targetType: 'inline'
              script: |
                $exe = "C:\Agent\_work\_tool\terraform\1.16.4\x64\terraform.exe"

                Write-Host "Checking Terraform executable..."
                if (!(Test-Path $exe)) {
                  throw "Terraform executable not found: $exe"
                }

                Get-Item $exe | Select-Object FullName, Length

                Write-Host "Testing Terraform version..."
                & $exe version

                if ($LASTEXITCODE -ne 0) {
                  throw "Terraform version command failed."
                }

          # Step 3: Terraform Init
          - task: TerraformTask@5
            displayName: 'Terraform Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
              backendServiceArm: 'krish-svc'
              backendAzureRmOverrideSubscriptionID: 'ef91bdd8-1032-48b8-9e99-c38172c04bb6'
              backendAzureRmResourceGroupName: 'krish-test'
              backendAzureRmStorageAccountName: 'krishtfstate42129'
              backendAzureRmContainerName: 'tfstate'
              backendAzureRmKey: 'dev.terraform.tfstate'

          # Step 4: Terraform Format Check
          - task: PowerShell@2
            displayName: 'Terraform Format Check'
            inputs:
              targetType: 'inline'
              script: |
                terraform fmt -check -recursive
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'

          # Step 5: Terraform Validate
          - task: TerraformTask@5
            displayName: 'Terraform Validate'
            inputs:
              provider: 'azurerm'
              command: 'validate'
              workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'