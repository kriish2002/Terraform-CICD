pool: Terraform-DevOps-Pool

trigger:
  branches:
    include:
      - main
      - feature/*

stages:

- stage: TerraformInitAndValidate
  displayName: Init and Validate

  jobs:

  - job: InitAndValidate
    displayName: Init and Validate

    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'

    - powershell: |
        terraform --version
        Write-Host "Terraform installed successfully"
      displayName: Verify Terraform

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: azurerm
        command: init
        workingDirectory: '$(Build.SourcesDirectory)/terraform/environments/dev'
        backendServiceArm: svc-ado
        backendAzureRmResourceGroupName: YOUR-RG
        backendAzureRmStorageAccountName: checkstorage132423
        backendAzureRmContainerName: containerstorage
        backendAzureRmKey: dev.terraform.tfstate


    # --------------------------------------------------------
    # Terraform Format Check
    # --------------------------------------------------------

    - powershell: |

        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        terraform fmt -check -recursive

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform formatting check failed"
          exit 1
        }

      displayName: Terraform Format Check
        # --------------------------------------------------------
    # Terraform Validate
    # --------------------------------------------------------

    - powershell: |

        cd "$(Build.SourcesDirectory)\terraform\environments\dev"

        terraform validate

        if ($LASTEXITCODE -ne 0) {
          Write-Error "Terraform validation failed"
          exit 1
        }

      displayName: Terraform Validate  