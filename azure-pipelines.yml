pool : Terraform-DevOps-Pool

trigger:
- main
- feature/*

stages:
  - stage: TerraformInitAndValidate
    displayName: Init and Validate
    jobs:
      - job: InitAndValidate
        displayName: Init and Validate

        steps:

        - task: TerraformTask@5
          inputs:
            provider: 'azurerm'
            command: 'init'
            workingDirectory: '$(System.DefaultWorkingDirectory)/environments/dev'
            backendServiceArm: 'krish-svc'
            backendAzureRmOverrideSubscriptionID: 'ef91bdd8-1032-48b8-9e99-c38172c04bb6'
            backendAzureRmResourceGroupName: 'krish-test'
            backendAzureRmStorageAccountName: 'krishtfstate42129'
            backendAzureRmContainerName: 'tfstate'
            backendAzureRmKey: 'dev.terraform.tfstate'