pool: Terraform-DevOps-Pool

trigger:
- main
- feature/*

stages:

# ============================================================
# STAGE 1 - INIT AND VALIDATE
# ============================================================

- stage: TerraformInitAndValidate
  displayName: Init and Validate

  jobs:
  - job: InitAndValidate
    displayName: Init and Validate

    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'

    - powershell: |
        terraform --version
        where.exe terraform
      displayName: Verify Terraform Installation

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'
        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Validate
      inputs:
        provider: 'azurerm'
        command: 'validate'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'


# ============================================================
# STAGE 2 - PLAN
# ============================================================

- stage: TerraformPlan
  displayName: Terraform Plan
  dependsOn: TerraformInitAndValidate
  condition: succeeded()

  jobs:
  - job: TerraformPlan
    displayName: Plan

    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'
        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Plan
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'
        environmentServiceNameAzureRM: 'svc-ado'


# ============================================================
# STAGE 3 - MANUAL APPROVAL
# ============================================================

- stage: ManualApproval
  displayName: Manual Approval Before Apply
  dependsOn: TerraformPlan
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: Approval
    displayName: Waiting for Approval
    pool: server

    steps:

    - task: ManualValidation@1
      displayName: Approve Terraform Apply
      inputs:
        notifyUsers: ''
        instructions: 'Terraform Plan complete hai. Apply karne ke liye approval dein.'
        onTimeout: 'reject'


# ============================================================
# STAGE 4 - APPLY
# ============================================================

- stage: TerraformApply
  displayName: Terraform Apply
  dependsOn: ManualApproval
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: TerraformApply
    displayName: Apply

    steps:

    - task: TerraformInstaller@1
      displayName: Install Terraform
      inputs:
        terraformVersion: '1.9.8'

    - task: TerraformTask@5
      displayName: Terraform Init
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'
        backendServiceArm: 'svc-ado'
        backendAzureRmStorageAccountName: 'checkstorage132423'
        backendAzureRmContainerName: 'containerstorage'
        backendAzureRmKey: 'dev.terraform.tfstate'

    - task: TerraformTask@5
      displayName: Terraform Apply
      inputs:
        provider: 'azurerm'
        command: 'apply'
        workingDirectory: '$(System.DefaultWorkingDirectory)/terraform/environments/dev'
        environmentServiceNameAzureRM: 'svc-ado'
        commandOptions: '-auto-approve'