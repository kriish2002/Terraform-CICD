pool: Terraform-DevOps-Pool

trigger:
- main
- feature/*

stages:

  - stage: TerraformInitAndValidate
    displayName: Init and Validate
    jobs: 
    - job: InitAndValidate
      displayName: Init and Validate
      steps:

      - task: TerraformTask@5
        inputs:
          provider: 'azurerm'
          command: 'init'
          workingDirectory: '$(System.DefaultWorkingDirectory)/environment/dev'
          backendServiceArm: 'svc-ado'
          backendAzureRmStorageAccountName: 'storageaxion'
          backendAzureRmContainerName: 'meradost02'
          backendAzureRmKey: 'dev.terrafrom.tfsate'