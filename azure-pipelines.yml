pool: Terraform-DevOps-Pool

trigger:
  - main
  - feature/*

steps:
  - task: PowerShell@2
    displayName: 'Test Agent'
    inputs:
      targetType: 'inline'
      script: |
        Write-Host "Agent is working!"
        Write-Host "Computer: $env:COMPUTERNAME"
        Write-Host "User: $env:USERNAME"

  - task: TerraformInstaller@1
    displayName: 'Install Terraform'
    inputs:
      terraformVersion: '1.16.4'

  - task: PowerShell@2
    displayName: 'Test Terraform Executable'
    inputs:
      targetType: 'inline'
      script: |
        $exe = "C:\Agent\_work\_tool\terraform\1.16.4\x64\terraform.exe"

        if (!(Test-Path $exe)) {
          throw "Terraform executable not found!"
        }

        Write-Host "Terraform executable found."
        & $exe version

        if ($LASTEXITCODE -ne 0) {
          throw "Terraform version test failed!"
        }

        Write-Host "Terraform test successful!"